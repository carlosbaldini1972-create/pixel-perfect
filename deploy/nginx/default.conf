# LAN-only HTTP reverse proxy.
# When you add a domain + HTTPS, switch server_name and uncomment the 443 block.

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # ACME challenge for future certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Supabase API (auth, rest, storage) proxied through Kong
    location /auth/    { proxy_pass http://kong:8000; include /etc/nginx/conf.d/_proxy.inc; }
    location /rest/    { proxy_pass http://kong:8000; include /etc/nginx/conf.d/_proxy.inc; }
    location /storage/ { proxy_pass http://kong:8000; include /etc/nginx/conf.d/_proxy.inc; }

    # App (TanStack Start)
    location / {
        proxy_pass http://app:3000;
        include /etc/nginx/conf.d/_proxy.inc;
    }
}

